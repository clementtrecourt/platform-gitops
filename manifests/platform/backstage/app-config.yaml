apiVersion: v1
kind: ConfigMap
metadata:
  name: backstage-config
  namespace: backstage
data:
  app-config.production.yaml: |
    app:
      title: AI Native Internal Developer Platform
      baseUrl: http://backstage.192.168.1.50.nip.io

    backend:
      baseUrl: http://backstage.192.168.1.50.nip.io
      listen:
        port: 7007
      cors:
        origin: http://backstage.192.168.1.50.nip.io
        methods: [GET, HEAD, PATCH, POST, PUT, DELETE]
        credentials: true
      database:
        client: pg
        connection:
          host: postgres
          port: 5432
          user: backstage
          password: backstagepassword

    integrations:
      github:
        - host: github.com
          token: ${GITHUB_TOKEN}
      gitlab:
        - host: gitlab.com
    scaffolder:
      defaultAuthor:
        name: Platform Bot
        email: platform-bot@platform.local

    catalog:
      rules:
        - allow: [Component, System, API, Resource, Location, Template]
      locations: []
